<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karar Çarkım - Eğlence Başlasın</title>
    <style>
        :root {
            --bg-color: #f0f2f5; --card-bg: #ffffff; --text-main: #1e293b;
            --text-secondary: #64748b; --primary: #6366f1; --accent: #f43f5e;
            --success: #10b981; --border: #e2e8f0; --shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] {
            --bg-color: #0b1120; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-secondary: #94a3b8; --border: #334155; --shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 15px; transition: 0.3s; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .logo-text { font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .stats-bar { display: flex; gap: 10px; }
        .stat-badge { background: var(--card-bg); padding: 6px 14px; border-radius: 15px; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; align-items: center; gap: 5px; }

        .wheel-box { background: var(--card-bg); padding: 35px 15px; border-radius: 30px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 0 auto 25px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)); }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--card-bg); }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 40px; height: 50px; z-index: 10; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
        
        .spin-btn { 
            background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; border: none; 
            padding: 18px 50px; font-size: 1.1rem; font-weight: 800; border-radius: 50px; cursor: pointer; 
            width: 100%; max-width: 280px; transition: 0.3s; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .section-card { background: var(--card-bg); border-radius: 25px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-title { font-weight: 800; font-size: 1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .cat-item { 
            background: var(--bg-color); border: 1px solid var(--border); padding: 15px; border-radius: 18px; 
            font-size: 0.9rem; cursor: pointer; text-align: center; font-weight: 600; transition: 0.2s;
        }
        .cat-item:hover { transform: translateY(-3px); border-color: var(--primary); }
        
        .history-list { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
        .history-item { 
            background: var(--primary); color: white; padding: 8px 15px; border-radius: 12px; 
            font-size: 0.75rem; white-space: nowrap; font-weight: 600; animation: fadeIn 0.5s ease;
        }

        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); display: none; justify-content: center; 
            align-items: center; z-index: 1000; backdrop-filter: blur(10px); 
        }
        .result-card { 
            background: var(--card-bg); width: 85%; max-width: 350px; padding: 40px 20px; 
            border-radius: 35px; text-align: center; border: 2px solid var(--primary);
            transform: scale(0.8); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .result-card { transform: scale(1); }
        .result-title { font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; }
        .result-text { font-size: 2.5rem; font-weight: 900; color: var(--primary); margin: 20px 0; line-height: 1.2; }

        footer { text-align: center; padding: 20px; font-size: 0.75rem; color: var(--text-secondary); opacity: 0.8; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body data-theme="light">
    <canvas id="confettiCanvas" style="position:fixed; top:0; left:0; pointer-events:none; z-index:2000;"></canvas>
    
    <div class="container">
        <header>
            <div class="logo-text">KARAR ÇARKIM</div>
            <div class="stats-bar">
                <div id="balBadge" class="stat-badge">✨ 3 Hak</div>
                <button onclick="toggleTheme()" class="stat-badge" style="cursor:pointer;">🌓</button>
            </div>
        </header>

        <section class="wheel-box">
            <div class="wheel-container">
                <svg class="pointer" viewBox="0 0 30 40"><path d="M15 40 L30 10 A15 15 0 1 0 0 10 Z" fill="#f43f5e" stroke="white" stroke-width="2"/></svg>
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
            </div>
            <button id="spinBtn" class="spin-btn" onclick="startSpin()">ŞANSINI DENE!</button>
        </section>

        <section class="section-card">
            <div class="card-title">🕒 Karar Geçmişi</div>
            <div id="historyList" class="history-list">
                <span style="color:var(--text-secondary); font-size:0.8rem;">Henüz karar verilmedi...</span>
            </div>
        </section>

        <section class="section-card">
            <div class="card-title">🎯 Hazır Paketler</div>
            <div class="category-grid">
                <div class="cat-item" onclick="loadPack('food')">🍕 Yemek</div>
                <div class="cat-item" onclick="loadPack('movie')">🍿 Sinema</div>
                <div class="cat-item" onclick="loadPack('game')">🎮 Oyun</div>
                <div class="cat-item" onclick="loadPack('activity')">🎢 Aktivite</div>
            </div>
        </section>

        <section class="section-card">
            <div class="card-title">📝 Kendi Listeni Yap</div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="optIn" placeholder="Seçenek yaz..." style="flex:1; padding:15px; border-radius:15px; border:1px solid var(--border); background:var(--bg-color); color:var(--text-main); outline:none; font-weight:600;">
                <button onclick="addOpt()" style="background:var(--success); color:white; border:none; width:50px; border-radius:15px; font-size:1.5rem; font-weight:bold; cursor:pointer;">+</button>
            </div>
            <div id="customList" style="display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto;"></div>
        </section>

        <footer>
            <p>© Gökhan ELGÜL tarafından tasarlanmıştır.<br>Eğlence ve Karar Bir Arada!</p>
        </footer>
    </div>

    <div id="modal" class="modal-overlay" onclick="closeM()">
        <div class="result-card" onclick="event.stopPropagation()">
            <div class="result-title">Çarkın Seçimi</div>
            <div id="resText" class="result-text">...</div>
            <button onclick="closeM()" class="spin-btn" style="padding:12px 30px; font-size:0.9rem;">HARİKA!</button>
        </div>
    </div>

    <script>
        // --- SES SİSTEMİ (Kod İçine Gömülü) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTick() {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
        function playWin() {
            [523.25, 659.25, 783.99].forEach((f, i) => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.3);
                osc.start(audioCtx.currentTime + i * 0.1); osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
            });
        }

        // --- MANTIK VE GÖRSEL ---
        let opts = ["Yemek", "Film", "Kitap", "Spor", "Oyun", "Uyku"];
        let history = []; let isSpinning = false; let currentAng = 0; let lastTickAng = 0;
        let dailyLimit = 3; let usedToday = 0; let isPremium = false;
        const colors = ['#6366f1', '#f43f5e', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#ec4899'];
        const canvas = document.getElementById('wheelCanvas'); const ctx = canvas.getContext('2d');

        window.onload = () => {
            const saved = localStorage.getItem('kc_opts'); if(saved) opts = JSON.parse(saved);
            const h = localStorage.getItem('kc_hist'); if(h) history = JSON.parse(h);
            isPremium = localStorage.getItem('kc_prem') === 'true';
            usedToday = parseInt(localStorage.getItem('kc_used') || '0');
            updateUI(); draw();
        };

        function updateUI() {
            document.getElementById('balBadge').innerText = isPremium ? "👑 Sınırsız" : `✨ ${dailyLimit - usedToday} Hak`;
            const hList = document.getElementById('historyList');
            if(history.length > 0) hList.innerHTML = history.slice(-5).reverse().map(item => `<span class="history-item">${item}</span>`).join('');
            const cList = document.getElementById('customList');
            cList.innerHTML = opts.map((o, i) => `
                <div style="display:flex; justify-content:space-between; background:var(--bg-color); padding:10px 15px; border-radius:12px; font-size:0.85rem; border:1px solid var(--border);">
                    <span>${o}</span><span onclick="remOpt(${i})" style="color:var(--accent); font-weight:bold; cursor:pointer;">×</span>
                </div>
            `).join('');
            localStorage.setItem('kc_opts', JSON.stringify(opts));
            localStorage.setItem('kc_hist', JSON.stringify(history));
        }

        function draw() {
            const sz = 600, center = 300, rad = 280, arc = (2 * Math.PI) / opts.length; ctx.clearRect(0,0,sz,sz);
            opts.forEach((t, i) => {
                const a = currentAng + i * arc;
                ctx.beginPath(); ctx.moveTo(center, center); ctx.arc(center, center, rad, a, a + arc);
                ctx.fillStyle = colors[i % colors.length]; ctx.fill();
                ctx.save(); ctx.translate(center, center); ctx.rotate(a + arc/2);
                ctx.textAlign = 'right'; ctx.fillStyle = 'white'; ctx.font = 'bold 24px sans-serif';
                ctx.fillText(t.substring(0, 15), rad - 35, 10); ctx.restore();
            });
            ctx.beginPath(); ctx.arc(center, center, 20, 0, 2*Math.PI); ctx.fillStyle = 'white'; ctx.fill();
        }

        function startSpin() {
            if(isSpinning || opts.length < 2) return;
            if(!isPremium && usedToday >= dailyLimit) { alert("Hakkınız bitti!"); return; }
            isSpinning = true; document.getElementById('spinBtn').disabled = true;
            const dur = 4000; const rotation = (12 + Math.random() * 8) * 2 * Math.PI;
            const start = performance.now(); const initialAng = currentAng;
            function animate(now) {
                const elapsed = now - start; const progress = Math.min(elapsed / dur, 1);
                const ease = 1 - Math.pow(1 - progress, 4); currentAng = initialAng + rotation * ease;
                const arcSize = (2 * Math.PI) / opts.length;
                if(Math.floor(currentAng / arcSize) !== Math.floor(lastTickAng / arcSize)) { playTick(); lastTickAng = currentAng; }
                draw();
                if(progress < 1) requestAnimationFrame(animate);
                else { isSpinning = false; document.getElementById('spinBtn').disabled = false; startAng = currentAng % (2 * Math.PI); finalize(); }
            }
            requestAnimationFrame(animate);
        }

        function finalize() {
            const arc = (2 * Math.PI) / opts.length; const norm = (currentAng + Math.PI / 2) % (2 * Math.PI);
            let idx = Math.floor((2 * Math.PI - norm) / arc) % opts.length; if(idx < 0) idx += opts.length;
            const res = opts[idx]; history.push(res);
            if(!isPremium) { usedToday++; localStorage.setItem('kc_used', usedToday); }
            updateUI(); playWin(); showRes(res); triggerConfetti();
        }

        function showRes(v) { document.getElementById('resText').innerText = v; document.getElementById('modal').style.display = 'flex'; setTimeout(() => document.getElementById('modal').classList.add('active'), 10); }
        function closeM() { document.getElementById('modal').classList.remove('active'); setTimeout(() => document.getElementById('modal').style.display = 'none', 300); }
        function addOpt() { const i = document.getElementById('optIn'); if(i.value.trim()) { opts.push(i.value.trim()); i.value = ''; updateUI(); draw(); } }
        function remOpt(i) { opts.splice(i, 1); updateUI(); draw(); }
        function loadPack(p) {
            const packs = { food: ["Kebap", "Pizza", "Sushi", "Ev Yemeği", "Salata", "Burger"], movie: ["Aksiyon", "Dram", "Komedi", "Korku", "Bilim Kurgu"], game: ["PUBG", "FIFA", "LoL", "Valorant", "Minecraft"], activity: ["Yürüyüş", "Kitap", "Film", "Uyku", "Spor", "Gezi"] };
            opts = packs[p]; updateUI(); draw();
        }
        function toggleTheme() { const b = document.body; const t = b.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; b.setAttribute('data-theme', t); draw(); }

        // --- KONFETİ ---
        const cC = document.getElementById('confettiCanvas'); const ccx = cC.getContext('2d');
        let particles = [];
        function triggerConfetti() {
            cC.width = window.innerWidth; cC.height = window.innerHeight;
            particles = Array.from({length: 80}, () => ({ x: Math.random() * cC.width, y: -20, s: Math.random() * 8 + 4, c: colors[Math.floor(Math.random() * colors.length)], v: Math.random() * 5 + 3, r: Math.random() * 360 }));
            updateConf();
        }
        function updateConf() {
            ccx.clearRect(0,0,cC.width,cC.height);
            particles.forEach((p, i) => { p.y += p.v; p.r += 4; ccx.save(); ccx.translate(p.x, p.y); ccx.rotate(p.r * Math.PI / 180); ccx.fillStyle = p.c; ccx.fillRect(-p.s/2, -p.s/2, p.s, p.s); ccx.restore(); if(p.y > cC.height) particles.splice(i, 1); });
            if(particles.length > 0) requestAnimationFrame(updateConf);
        }
    </script>
</body>
</html>
